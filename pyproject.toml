[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ditta-ia-adapter"
version = "0.1.0"
description = "An unofficial DITTA indexer that searches the Internet Archive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "internetarchive>=5.12",
    "coincurve>=21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ditta-ia-adapter = "ditta_ia_adapter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
